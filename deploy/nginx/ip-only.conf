# Quick IP-only access before you have a domain.
# Install:
#   sudo cp deploy/nginx/ip-only.conf /etc/nginx/sites-available/groupbuy-ip
#   sudo ln -sf /etc/nginx/sites-available/groupbuy-ip /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then open http://YOUR_VPS_IP (port 80, not 3000).
#
# Set in .env:
#   NEXTAUTH_URL=http://YOUR_VPS_IP
#   SESSION_SERVICE_PUBLIC_URL=http://YOUR_VPS_IP/session

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 10M;

    # Session service (tool launch + cookie proxy) — port 4000 is not exposed publicly
    location /session/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
